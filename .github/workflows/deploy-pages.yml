name: Deploy Pages

on:
  push:
    branches: [main, web]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketing site (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout web app (web)
        uses: actions/checkout@v4
        with:
          ref: web
          path: webapp

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json

      - name: Install web app dependencies
        working-directory: webapp/web
        run: npm ci

      - name: Build web app (static export)
        working-directory: webapp/web
        env:
          NEXT_PUBLIC_BASE_PATH: /SheshaBiz/app
        run: npm run build

      - name: Fetch latest APK/EXE for direct-download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/downloads
          apk_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("apk-run-")))][0].tagName')
          exe_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("desktop-run-")))][0].tagName')
          if [ -n "$apk_tag" ]; then
            gh release download "$apk_tag" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir dist/downloads --clobber
            mv dist/downloads/*.apk dist/downloads/SheshaBiz.apk
          fi
          if [ -n "$exe_tag" ]; then
            gh release download "$exe_tag" --repo "$GITHUB_REPOSITORY" --pattern "*.exe" --dir dist/downloads --clobber
            mv dist/downloads/*.exe dist/downloads/SheshaBiz-Setup.exe
          fi

      - name: Assemble combined site
        run: |
          cp site/*.html dist/
          cp -r site/assets dist/assets
          mkdir -p dist/app
          cp -r webapp/web/out/. dist/app/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
