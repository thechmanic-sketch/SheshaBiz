name: Build Desktop App

on:
  push:
    branches: [web]
    paths:
      - "web/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Windows installer
        working-directory: web
        run: npm run tauri build

      - name: Locate installer
        id: find_installer
        shell: bash
        run: |
          installer=$(find web/src-tauri/target/release/bundle/nsis -name "*.exe" | head -n1)
          if [ -z "$installer" ]; then
            echo "No .exe installer found" >&2
            exit 1
          fi
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Publish desktop build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-run-${{ github.run_number }}
          name: "SheshaBiz Desktop — build ${{ github.run_number }}"
          files: ${{ steps.find_installer.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
