name: Build Release APK

on:
  push:
    branches:
      - claude/quickquote-sa-android-kxdu2i
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-run-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "QuickQuoteSA-${TAG}.apk"
          gh release create "$TAG" "QuickQuoteSA-${TAG}.apk" \
            --repo "${{ github.repository }}" \
            --title "QuickQuote SA — build ${{ github.run_number }}" \
            --notes "Automated release build from commit ${{ github.sha }}."
